<rect width="1600" height="1060" fill="#ffffff"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Library Borrowing System — Container Architecture</text>
<text x="40" y="76" font-size="15" fill="#475569">3 application modules + PostgreSQL + Nginx reverse proxy (one Compose stack) · Jenkins CI/CD (separate Compose stack)</text>
