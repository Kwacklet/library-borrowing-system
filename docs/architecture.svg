<rect x="1026" y="926" width="50" height="20" rx="10" fill="#ea580c"/><text x="1090" y="941" font-size="13" fill="#334155">port published to the laptop (host:container)</text>
<ellipse cx="1051" cy="966" rx="25" ry="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="1090" y="971" font-size="13" fill="#334155">named Docker volume (persistent data)</text>
<text x="1026" y="995" font-size="12" fill="#475569">Only proxy (8080) and Jenkins (8081) are reachable from outside Docker.</text>
