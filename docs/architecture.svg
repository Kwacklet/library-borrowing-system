<text x="800.0" y="860.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">jenkins_home</text>
<text x="800.0" y="878.5" font-size="12" fill="#475569" text-anchor="middle">named volume (jobs, plugins, creds)</text>
<path d="M625,850 L698,850" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="345" y="900" font-size="14" font-weight="700" fill="#7c3aed">Pipeline:</text>
<text x="345" y="921" font-size="14" fill="#334155">Checkout → Test → Build Images → Deploy → Smoke Test</text>
<text x="345" y="945" font-size="13" fill="#475569">Images tagged library/*:BUILD_NUMBER → rollback = redeploy an older tag</text>
<text x="345" y="967" font-size="13" fill="#475569">Secrets: Jenkins credential "library-env" (Secret file), never in Git</text>
<text x="345" y="989" font-size="13" fill="#475569">Failing test at Test stage → Build/Deploy skipped, old version keeps running</text>
<rect x="1010" y="690" width="520" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="1270.0" y="718" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Docker Engine (Docker Desktop)</text>
<text x="1270.0" y="740" font-size="14" fill="#334155" text-anchor="middle">reached through /var/run/docker.sock</text>
<text x="1270.0" y="760" font-size="14" fill="#334155" text-anchor="middle">builds images · creates / replaces containers</text>
<path d="M625,770 L1008,770" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arp)"/>
<text x="816" y="760" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4">docker / docker compose via mounted docker.sock</text>
