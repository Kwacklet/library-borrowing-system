# nginx.conf (proxy) - the SINGLE public entry point of the application.
#   /                 -> frontend
#   /api/books...     -> books-api      (e.g. /api/books/5 -> /books/5)
#   /api/borrowings...-> borrowing-api  (e.g. /api/borrowings -> /borrowings)
server {
    listen 8080;

    # Docker's internal DNS server. "valid=10s" makes Nginx look up the
    # container names again every 10 seconds, so it finds containers that
    # Jenkins re-created during a deployment.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Service names from docker-compose.yml + their internal ports
    set $frontend      http://frontend:8080;
    set $books_api     http://books-api:3001;
    set $borrowing_api http://borrowing-api:3002;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Health endpoints (used by the smoke test)
    location = /api/books/health {
        rewrite ^ /health break;
        proxy_pass $books_api;
    }
    location = /api/borrowings/health {
        rewrite ^ /health break;
        proxy_pass $borrowing_api;
    }

    # APIs: remove the "/api" prefix, then forward
    location /api/books {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $books_api;
    }
    location /api/borrowings {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $borrowing_api;
    }

    # Everything else goes to the React frontend
    location / {
        proxy_pass $frontend;
    }
}
